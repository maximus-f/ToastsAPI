name: ToastsAPITest
version: '${project.version}'
main: com.frengor.toaststest.ToastPlugin
api-version: '1.19'
description: Standalone test plugin for the shadeable ToastsAPI library
author: Perotin

commands:
  toast:
    description: Send a test toast notification
    usage: /toast <task|goal|challenge> [message]
    permission: toastapi.toast
    permission-message: §cYou don't have permission to use this command!

permissions:
  toastapi.toast:
    description: Allows use of the /toast command
    default: op
  toastapi.*:
    description: Gives access to all ToastAPI permissions
    default: op
    children:
      toastapi.toast: true
